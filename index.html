<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linoleum POS</title>

  <!-- Google Fonts & AI Libraries -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.18.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.0/dist/mobilenet.min.js"></script>

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #16a34a;
      --danger: #dc2626;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 40px; }

    .app-header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo { display: flex; align-items: center; gap: 10px; }
    .status-badge { background: #dcfce7; color: #15803d; font-size: 12px; padding: 2px 8px; border-radius: 12px; }

    .app-nav { display: flex; background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 0 24px; }
    .tab-btn {
      padding: 14px 20px; border: none; background: none; font-size: 15px; font-weight: 500;
      color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent;
    }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

    .app-content { max-width: 1200px; margin: 24px auto; padding: 0 16px; }
    .view { display: none; }
    .view.active { display: block; }

    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
    .grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 768px) { .grid-2col { grid-template-columns: 1fr; } }

    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .product-grid { display: flex; flex-direction: column; gap: 10px; max-height: 400px; overflow-y: auto; }

    .product-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; transition: 0.2s;
    }
    .product-row:hover { background-color: #f1f5f9; }

    .pleft { display: flex; align-items: center; gap: 12px; }
    .pthumb, .pthumb-placeholder, .table-thumb {
      width: 40px; height: 40px; border-radius: 6px; object-fit: cover;
      background: #e2e8f0; display: flex; align-items: center; justify-content: center; font-size: 12px;
    }

    .pprice { font-weight: 600; }
    .pstock.low { color: var(--danger); }

    .receipt-list { min-height: 150px; max-height: 300px; overflow-y: auto; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 10px 0; margin: 16px 0; }
    .receipt-item { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }

    .btn-primary, .btn-secondary, .btn-success { padding: 8px 16px; border-radius: 6px; border: none; font-weight: 500; cursor: pointer; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-secondary { background: #e2e8f0; color: var(--text); }
    .btn-success { background: var(--success); color: white; }
    .btn-block { width: 100%; padding: 12px; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-group { margin-bottom: 12px; }
    .form-group input { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; }

    .data-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    .data-table th, .data-table td { padding: 10px; border-bottom: 1px solid var(--border); text-align: left; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
    .stat-card { background: var(--card-bg); padding: 16px; border-radius: 8px; border: 1px solid var(--border); }
    .stat-title { display: block; font-size: 13px; color: var(--text-muted); }
    .stat-value { font-size: 22px; font-weight: 700; }

    .margin-top { margin-top: 20px; }
    .toast { position: fixed; bottom: 20px; right: 20px; background: #333; color: #fff; padding: 10px 20px; border-radius: 6px; opacity: 0; transition: 0.3s; pointer-events: none; }
    .toast.show { opacity: 1; }

    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal-content { background: white; padding: 24px; border-radius: 8px; width: 350px; }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="logo">
      <span class="logo-icon">📐</span>
      <h1>Linoleum POS</h1>
      <span id="statusTag" class="status-badge">tayyor</span>
    </div>
    <div class="header-actions">
      <button class="btn-secondary" onclick="toggleTgSettings()">⚙️ Bot Sozlamalari</button>
    </div>
  </header>

  <!-- Telegram Sozlamalar Pop-up -->
  <div id="tgSettingsPopup" class="modal" style="display: none;">
    <div class="modal-content">
      <h3>Telegram Bot Sozlamalari</h3>
      <div class="form-group">
        <label>Bot Token:</label>
        <input type="text" id="tgBotToken" placeholder="123456789:ABCdef...">
      </div>
      <div class="form-group">
        <label>Chat ID:</label>
        <input type="text" id="tgChatId" placeholder="987654321">
      </div>
      <div class="modal-actions">
        <button class="btn-primary" onclick="saveTgSettings()">Saqlash</button>
        <button class="btn-secondary" onclick="toggleTgSettings()">Yopish</button>
      </div>
    </div>
  </div>

  <nav class="app-nav">
    <button class="tab-btn active" data-view="kassa" onclick="switchTab('kassa')">🛒 Kassa</button>
    <button class="tab-btn" data-view="ombor" onclick="switchTab('ombor')">📦 Ombor</button>
    <button class="tab-btn" data-view="hisobot" onclick="switchTab('hisobot')">📊 Hisobotlar</button>
  </nav>

  <main class="app-content">

    <!-- KASSA -->
    <section id="view-kassa" class="view active">
      <div class="grid-2col">
        <div class="card">
          <div class="card-header">
            <h2>Mahsulotlar</h2>
            <button class="btn-secondary" onclick="switchTab('ombor')">+ Yangi qo'shish</button>
          </div>
          <div id="kassaProductList" class="product-grid"></div>
        </div>

        <div class="card">
          <h2>Xarid Cheki</h2>
          <div id="receiptItems" class="receipt-list">
            <div class="receipt-empty">Savat bo'sh</div>
          </div>
          <div class="receipt-footer">
            <div class="total-row" style="margin-bottom: 12px; font-size: 18px;">
              <span>Jami summa: </span>
              <strong id="receiptTotal">0</strong> so'm
            </div>
            <button id="sellBtn" class="btn-success btn-block" disabled onclick="checkout()">Sotuvni Yakunlash</button>
          </div>
        </div>
      </div>
    </section>

    <!-- OMBOR -->
    <section id="view-ombor" class="view">
      <div class="card">
        <h2>Yangi Mahsulot Qo'shish</h2>
        <div class="form-grid">
          <input type="text" id="newName" placeholder="Mahsulot nomi (masalan: Linoleum 3mm)" style="padding:8px;">
          <input type="text" id="newDoc" placeholder="Hujjat / Seriya raqami" style="padding:8px;">
          <input type="number" id="newPrice" placeholder="Narxi (1m2 uchun)" style="padding:8px;">
          <input type="number" id="newQty" placeholder="Qoldiq (metr)" style="padding:8px;">
          <input type="file" id="newImageInput" accept="image/*" onchange="handleNewImageFile(this)">
          <button class="btn-primary" onclick="addNewProduct()">Qo'shish</button>
        </div>
      </div>

      <div class="card margin-top">
        <h2>Ombordagi Mahsulotlar</h2>
        <table class="data-table">
          <thead>
            <tr>
              <th>Rasm</th>
              <th>Nomi</th>
              <th>Hujjat</th>
              <th>Narx</th>
              <th>Qoldiq</th>
              <th>Amallar</th>
            </tr>
          </thead>
          <tbody id="omborTableBody"></tbody>
        </table>
      </div>
    </section>

    <!-- HISOBOT -->
    <section id="view-hisobot" class="view">
      <div class="stats-grid">
        <div class="stat-card">
          <span class="stat-title">Bugungi Savdo</span>
          <span id="statToday" class="stat-value">0</span> so'm
        </div>
        <div class="stat-card">
          <span class="stat-title">Ombor Qiymati</span>
          <span id="statStockValue" class="stat-value">0</span> so'm
        </div>
      </div>

      <div class="grid-2col margin-top">
        <div class="card">
          <h2>Chiqim Qo'shish</h2>
          <div class="form-group">
            <input type="number" id="newExpenseAmount" placeholder="Summa">
          </div>
          <div class="form-group">
            <input type="text" id="newExpenseNote" placeholder="Izoh (masalan: Tushlik)">
          </div>
          <button class="btn-primary" onclick="addExpense()">Chiqimni Saqlash</button>
          
          <h3 class="margin-top">Chiqimlar Ro'yxati</h3>
          <div id="expenseList"></div>
        </div>

        <div class="card">
          <h2>Telegram & Zaxira</h2>
          <button class="btn-success btn-block" onclick="sendTelegramReport()">📲 Telegramga Hisobot Yuborish</button>
        </div>
      </div>
    </section>

  </main>

  <div id="toast" class="toast"></div>

  <script>
    const fmt = n => new Intl.NumberFormat('uz-UZ').format(Math.round(n || 0));
    const escapeHtml = str => (str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));

    let products = [];
    let sales = [];
    let expenses = [];
    let cart = []; 
    let newImageBase64 = null;

    function showToast(msg){
      const t = document.getElementById('toast');
      if(!t) return;
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(()=>t.classList.remove('show'), 1800);
    }

    function setStatus(text){
      const el = document.getElementById('statusTag');
      if(el) el.textContent = text;
    }

    function toggleTgSettings(){
      const popup = document.getElementById('tgSettingsPopup');
      if(popup) popup.style.display = (popup.style.display === 'block') ? 'none' : 'block';
    }

    function switchTab(viewId){
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      const btn = document.querySelector(`[data-view="${viewId}"]`);
      const view = document.getElementById(`view-${viewId}`);
      if(btn) btn.classList.add('active');
      if(view) view.classList.add('active');
    }

    function loadData(){
      try { products = JSON.parse(localStorage.getItem('mahsulotlar')) || []; } catch(e){ products = []; }
      try { sales = JSON.parse(localStorage.getItem('sotuvlar')) || []; } catch(e){ sales = []; }
      try { expenses = JSON.parse(localStorage.getItem('chiqimlar')) || []; } catch(e){ expenses = []; }
      
      const tToken = localStorage.getItem('tg_token');
      const tChat = localStorage.getItem('tg_chat');
      if(tToken && document.getElementById('tgBotToken')) document.getElementById('tgBotToken').value = tToken;
      if(tChat && document.getElementById('tgChatId')) document.getElementById('tgChatId').value = tChat;

      renderAll();
    }

    function saveProducts(){ localStorage.setItem('mahsulotlar', JSON.stringify(products)); }
    function saveSales(){ localStorage.setItem('sotuvlar', JSON.stringify(sales)); }
    function saveExpenses(){ localStorage.setItem('chiqimlar', JSON.stringify(expenses)); }

    function saveTgSettings(){
      const token = document.getElementById('tgBotToken').value.trim();
      const chatId = document.getElementById('tgChatId').value.trim();
      localStorage.setItem('tg_token', token);
      localStorage.setItem('tg_chat', chatId);
      showToast("Bot sozlamalari saqlandi");
      toggleTgSettings();
    }

    function renderAll(){
      renderKassaList();
      renderReceipt();
      renderOmborTable();
      renderHisobot();
    }

    function renderKassaList(){
      const el = document.getElementById('kassaProductList');
      if(!el) return;
      el.innerHTML = '';
      if(products.length === 0){
        el.innerHTML = '<div style="color:#64748b;">Omborda mahsulot yo\'q</div>';
        return;
      }
      products.forEach(p=>{
        const row = document.createElement('div');
        row.className = 'product-row';
        const thumb = p.image ? `<img class="pthumb" src="${p.image}">` : `<div class="pthumb">—</div>`;
        row.innerHTML = `
          <div class="pleft">
            ${thumb}
            <div>
              <div><strong>${escapeHtml(p.name)}</strong></div>
              <div style="font-size:12px; color:#64748b;">${escapeHtml(p.doc || '—')}</div>
            </div>
          </div>
          <div>
            <div class="pprice">${fmt(p.price)} so'm</div>
            <div class="pstock ${p.qty <= 3 ? 'low' : ''}">${p.qty} m</div>
          </div>
        `;
        row.onclick = () => addToCart(p);
        el.appendChild(row);
      });
    }

    function addToCart(product){
      if(product.qty <= 0){ showToast('Omborda qoldiq yo\'q'); return; }
      const existing = cart.find(c => c.productId === product.id);
      if(existing){
        if(existing.qty + 1 > product.qty){ showToast('Omborda yetarli emas'); return; }
        existing.qty += 1;
      } else {
        cart.push({productId: product.id, name: product.name, price: product.price, qty: 1});
      }
      renderReceipt();
    }

    function renderReceipt(){
      const container = document.getElementById('receiptItems');
      const totalEl = document.getElementById('receiptTotal');
      const sellBtn = document.getElementById('sellBtn');
      if(!container || !totalEl || !sellBtn) return;

      if(cart.length === 0){
        container.innerHTML = '<div style="color:#64748b;">Savat bo\'sh</div>';
        totalEl.textContent = '0';
        sellBtn.disabled = true;
        return;
      }
      let total = 0;
      container.innerHTML = '';
      cart.forEach(item => {
        const sum = item.price * item.qty;
        total += sum;
        const row = document.createElement('div');
        row.className = 'receipt-item';
        row.innerHTML = `
          <div>${escapeHtml(item.name)} (${item.qty} m)</div>
          <div><strong>${fmt(sum)}</strong> so'm</div>
        `;
        container.appendChild(row);
      });
      totalEl.textContent = fmt(total);
      sellBtn.disabled = false;
    }

    function checkout(){
      if(cart.length === 0) return;
      const sale = {
        id: 's_' + Date.now(),
        date: new Date().toISOString(),
        items: [...cart],
        total: cart.reduce((sum, item) => sum + (item.price * item.qty), 0)
      };

      sales.unshift(sale);
      cart.forEach(item => {
        const p = products.find(prod => prod.id === item.productId);
        if(p) p.qty = Math.round((p.qty - item.qty) * 100) / 100;
      });

      cart = [];
      saveProducts();
      saveSales();
      renderAll();
      showToast('Sotuv yakunlandi!');
    }

    function renderOmborTable(){
      const tbody = document.getElementById('omborTableBody');
      if(!tbody) return;
      tbody.innerHTML = '';
      products.forEach(p => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${p.image ? `<img class="table-thumb" src="${p.image}">` : '—'}</td>
          <td><strong>${escapeHtml(p.name)}</strong></td>
          <td>${escapeHtml(p.doc || '—')}</td>
          <td>${fmt(p.price)} so'm</td>
          <td class="${p.qty <= 3 ? 'low' : ''}">${p.qty} m</td>
          <td><button class="btn-secondary" onclick="deleteProduct('${p.id}')">🗑️</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function handleNewImageFile(input){
      const file = input.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = e => { newImageBase64 = e.target.result; };
      reader.readAsDataURL(file);
    }

    function addNewProduct(){
      const name = document.getElementById('newName').value.trim();
      const doc = document.getElementById('newDoc').value.trim();
      const price = parseFloat(document.getElementById('newPrice').value);
      const qty = parseFloat(document.getElementById('newQty').value);

      if(!name || isNaN(price) || isNaN(qty)){
        showToast('Nomi, narxi va qoldiqni kiriting!');
        return;
      }

      products.push({ id: 'p_' + Date.now(), name, doc, price, qty, image: newImageBase64 });
      saveProducts();
      
      document.getElementById('newName').value = '';
      document.getElementById('newDoc').value = '';
      document.getElementById('newPrice').value = '';
      document.getElementById('newQty').value = '';
      newImageBase64 = null;

      renderAll();
      showToast('Mahsulot qo\'shildi!');
    }

    function deleteProduct(id){
      if(!confirm('O\'chirmoqchimisiz?')) return;
      products = products.filter(p => p.id !== id);
      saveProducts();
      renderAll();
    }

    function addExpense(){
      const amount = parseFloat(document.getElementById('newExpenseAmount').value);
      const note = document.getElementById('newExpenseNote').value.trim();

      if(isNaN(amount) || amount <= 0){
        showToast('Summani kiriting!');
        return;
      }

      expenses.unshift({ id: 'ex_' + Date.now(), amount, note, date: new Date().toISOString() });
      saveExpenses();

      document.getElementById('newExpenseAmount').value = '';
      document.getElementById('newExpenseNote').value = '';
      renderHisobot();
      showToast('Chiqim saqlandi!');
    }

    function renderHisobot(){
      const todayStr = new Date().toISOString().slice(0, 10);
      let todaySales = 0, stockValue = 0;

      sales.forEach(s => { if(s.date.startsWith(todayStr)) todaySales += s.total; });
      products.forEach(p => { stockValue += (p.price * p.qty); });

      if(document.getElementById('statToday')) document.getElementById('statToday').textContent = fmt(todaySales);
      if(document.getElementById('statStockValue')) document.getElementById('statStockValue').textContent = fmt(stockValue);

      const expList = document.getElementById('expenseList');
      if(expList){
        expList.innerHTML = expenses.map(e => `
          <div style="display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #eee;">
            <span>${escapeHtml(e.note || 'Chiqim')}</span>
            <strong>${fmt(e.amount)} so'm</strong>
          </div>
        `).join('');
      }
    }

    function sendTelegramReport(){
      const token = localStorage.getItem('tg_token');
      const chatId = localStorage.getItem('tg_chat');

      if(!token || !chatId){
        showToast("Avval Bot Sozlamalaridan Token va Chat ID ni kiriting!");
        toggleTgSettings();
        return;
      }

      const todayStr = new Date().toISOString().slice(0, 10);
      let todaySales = 0;
      sales.forEach(s => { if(s.date.startsWith(todayStr)) todaySales += s.total; });

      const text = `📊 *Kunlik Hisobot*\n🗓️ Sana: ${todayStr}\n💰 Bugungi Savdo: ${fmt(todaySales)} so'm`;

      fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: chatId, text: text, parse_mode: 'Markdown' })
      })
      .then(res => res.json())
      .then(data => {
        if(data.ok) showToast("Hisobot Telegramga yuborildi!");
        else showToast("Telegramga yuborishda xatolik!");
      })
      .catch(() => showToast("Ulanish xatosi!"));
    }

    window.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
