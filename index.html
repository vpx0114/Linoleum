<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ombor Boshqaruvi va Telegram Bildirishnoma Tizimi</title>
    <style>
        :root {
            --primary-color: #2b5876;
            --secondary-color: #4e4376;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 550px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eef2f5;
        }

        .header-bar h2 {
            font-size: 20px;
            color: var(--primary-color);
        }

        .action-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.1s ease;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-success {
            background-color: var(--success-color);
        }

        .btn-success:hover {
            background-color: #218838;
        }

        .btn-danger {
            background-color: var(--danger-color);
            width: 100%;
            padding: 12px;
            font-size: 15px;
            margin-top: 10px;
        }

        .btn-danger:hover {
            background-color: #c82333;
        }

        .more-btn {
            background: none;
            border: none;
            font-size: 24px;
            color: #666;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .more-btn:hover {
            background-color: #e9ecef;
        }

        /* Yashirin Sozlamalar Paneli */
        .settings-panel {
            display: none;
            background-color: #f8f9fa;
            border: 1px solid #dde2e5;
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 25px;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .settings-panel h3 {
            font-size: 16px;
            margin-bottom: 12px;
            color: var(--secondary-color);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #555;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: var(--primary-color);
        }

        .btn-primary {
            background-color: var(--primary-color);
            width: 100%;
        }

        .btn-primary:hover {
            background-color: #1a3c52;
        }

        .section-title {
            font-size: 16px;
            margin-bottom: 15px;
            color: #444;
        }

        hr {
            border: 0;
            height: 1px;
            background-color: #eef2f5;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Yuqori panel va harakatlar -->
        <div class="header-bar">
            <h2>Ombor Nazorati</h2>
            <div class="action-group">
                <button class="btn btn-success" id="sendReportBtn" onclick="yuborHisobot()">Hisobotni yubor</button>
                <button class="more-btn" onclick="toggleSettings()" title="Sozlamalar">⋮</button>
            </div>
        </div>

        <!-- Yashirin Telegram Sozlamalari Paneli -->
        <div id="settingsPanel" class="settings-panel">
            <h3>Telegram Bot Sozlamalari</h3>
            <div class="form-group">
                <label for="botToken">Bot Token:</label>
                <input type="password" id="botToken" placeholder="123456789:AA... bot tokeningiz">
            </div>
            <div class="form-group">
                <label for="chatId">Chat ID / Guruh ID:</label>
                <input type="text" id="chatId" placeholder="-100xxxxxxx yoki shaxsiy ID">
            </div>
            <button class="btn btn-primary" onclick="saqlashSettings()">Sozlamalarni saqlash</button>
        </div>

        <!-- Ombor Kirim/Chiqim Bo'limi -->
        <h3 class="section-title">Mahsulot Qoldig'ini Tekshirish</h3>
        
        <div class="form-group">
            <label for="hujjatRaqami">Hujjat Raqami:</label>
            <input type="text" id="hujjatRaqami" placeholder="Masalan: 1045">
        </div>

        <div class="form-group">
            <label for="qoldiqMetr">Hozirgi Qoldiq (metr):</label>
            <input type="number" id="qoldiqMetr" placeholder="Masalan: 2.5" step="0.01">
        </div>

        <button class="btn btn-danger" onclick="tekshirishVaYuborish()">Qoldiqni saqlash va tekshirish</button>
    </div>

    <script>
        // Sahifa yuklanganda mavjud saqlangan ma'lumotlarni chiqarish
        document.addEventListener('DOMContentLoaded', function() {
            if (localStorage.getItem('bot_token')) {
                document.getElementById('botToken').value = localStorage.getItem('bot_token');
            }
            if (localStorage.getItem('chat_id')) {
                document.getElementById('chatId').value = localStorage.getItem('chat_id');
            }
        });

        // Uchta nuqta (⋮) tugmasi orqali Sozlamalar panelini yashirish va ko'rsatish
        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            if (panel.style.display === 'none' || panel.style.display === '') {
                panel.style.display = 'block';
            } else {
                panel.style.display = 'none';
            }
        }

        // Sozlamalarni brauzer xotirasiga (localStorage) saqlash
        function saqlashSettings() {
            const token = document.getElementById('botToken').value.trim();
            const chat = document.getElementById('chatId').value.trim();

            if (!token || !chat) {
                alert("Iltimos, Bot Token va Chat ID maydonlarini to'liq kiriting!");
                return;
            }

            localStorage.setItem('bot_token', token);
            localStorage.setItem('chat_id', chat);

            alert("Telegram sozlamalari muvaffaqiyatli saqlandi!");
            document.getElementById('settingsPanel').style.display = 'none'; // Saqlangach panelni yopish
        }

        // Telegram API orqali xabar yuboruvchi universal funksiya
        function telegramgaYubor(matn) {
            const token = localStorage.getItem('bot_token');
            const chatId = localStorage.getItem('chat_id');

            if (!token || !chatId) {
                alert("Telegram Bot Token yoki Chat ID topilmadi! O'ng yuqoridagi (⋮) tugmasini bosib sozlamalarni saqlang.");
                return;
            }

            const url = `https://api.telegram.org/bot${token}/sendMessage`;

            fetch(url, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json' 
                },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: matn
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.ok) {
                    alert("Xabar Telegram'ga muvaffaqiyatli yuborildi!");
                } else {
                    alert("Telegram API Xatoligi: " + data.description);
                }
            })
            .catch(error => {
                alert("Xabar yuborishda tarmoq xatoligi yuz berdi: " + error);
            });
        }

        // 3 metrdan kam qolganda avtomatik ogohlantirish mantiqi
        function tekshirishVaYuborish() {
            const hujjat = document.getElementById('hujjatRaqami').value.trim();
            const qoldiqInput = document.getElementById('qoldiqMetr').value;
            const qoldiq = parseFloat(qoldiqInput);

            // Bugungi sana (DD.MM.YYYY formatida)
            const bugun = new Date();
            const sana = bugun.toLocaleDateString('ru-RU');

            if (!hujjat || isNaN(qoldiq)) {
                alert("Iltimos, Hujjat raqami va Qoldiq metrini to'g'ri kiriting!");
                return;
            }

            // MANTIQ: 3 metrdan kam bo'lsa xabar yuboriladi
            if (qoldiq < 3) {
                const xabar = `‼️💢💢💢💢‼️\nsanasi: ${sana}\nHujjat raqami: ${hujjat}\nBizda ${qoldiq} m qoldi.`;
                telegramgaYubor(xabar);
            } else {
                alert(`Qoldiq yetarli (${qoldiq} m). Ogohlantirish yuborilmadi.`);
            }
        }

        // Ochiq turgan "Hisobotni yubor" tugmasi funksiyasi
        function yuborHisobot() {
            const bugun = new Date().toLocaleDateString('ru-RU');
            const hisobotMatni = `📊 Kunlik Hisobot (${bugun}):\nTizim muvaffaqiyatli ishlamoqda.`;
            telegramgaYubor(hisobotMatni);
        }
    </script>
</body>
</html>
